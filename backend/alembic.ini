[alembic]
script_location = alembic
prepend_sys_path = .

# `sqlalchemy.url` is deliberately left unset here -- `alembic/env.py` sets it at runtime from
# the `DATABASE_URL` env var (same var `AppModule`'s `OrmModule.for_root_async()` reads via
# `ConfigService`), so one env var stays the single source of truth for both the running app and
# migrations, instead of a second, easily-out-of-sync `sqlalchemy.url` living in this file.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
