[project]
name = "api.swadely.com"
version = "0.1.0"
description = "Generated with the Austial CLI (`austial new`)."
requires-python = ">=3.11"
dependencies = [
    "austial>=0.1.0",
    "asyncpg>=0.29.0",
    "passlib[bcrypt]>=1.7.4",
    # `passlib` 1.7.4 (its last release, 2020, effectively unmaintained) probes
    # `bcrypt.__about__.__version__` to detect the backend version -- an attribute
    # `bcrypt` >=4.1 removed, breaking every hash/verify call at runtime. Pin below
    # the break until `passlib` cuts a compatible release (see pyca/bcrypt#684).
    "bcrypt<4.1",
    "python-jose[cryptography]>=3.3.0",
    "pydantic[email]>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.7.0",
]

[tool.uv.sources]
austial = { path = "../../austial-py/packages/austial", editable = true }
austial-common = { path = "../../austial-py/packages/common", editable = true }
austial-core = { path = "../../austial-py/packages/core", editable = true }
austial-config = { path = "../../austial-py/packages/config", editable = true }
austial-orm = { path = "../../austial-py/packages/orm", editable = true }
austial-terminus = { path = "../../austial-py/packages/terminus", editable = true }
austial-testing = { path = "../../austial-py/packages/testing", editable = true }
austial-cli = { path = "../../austial-py/packages/cli", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["*_spec.py", "test_*.py", "*_test.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # function calls in default args (`Body()`, `Query()`, ... -- FastAPI's own idiom)

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
