<div class="login">
  <mat-card class="login__card">
    <mat-card-header>
      <mat-card-title>{{ 'auth.login.title' | t }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="login__form">
        <mat-form-field appearance="outline">
          <mat-label>{{ 'auth.login.email_label' | t }}</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>{{ 'auth.login.password_label' | t }}</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
        </mat-form-field>

        @if (errorMessage()) {
          <p class="login__error">{{ errorMessage() }}</p>
        }

        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || submitting()">
          @if (submitting()) {
            <mat-spinner diameter="20" />
          } @else {
            {{ 'auth.login.submit' | t }}
          }
        </button>
      </form>
    </mat-card-content>

    <mat-card-footer class="login__footer">
      <span>{{ 'auth.login.register_prompt' | t }}</span>
      <a routerLink="/register">{{ 'auth.login.register_link' | t }}</a>
    </mat-card-footer>
  </mat-card>
</div>
