<div class="liveness-step">
  <h2>{{ 'kyc.liveness.title' | t }}</h2>
  <p class="liveness-step__description">{{ 'kyc.liveness.description' | t }}</p>

  <div class="liveness-step__stage">
    <video #video class="liveness-step__video" [hidden]="!cameraActive()" autoplay playsinline muted></video>
    <canvas #canvas class="liveness-step__canvas" hidden></canvas>

    @if (capturedImage()) {
      <img class="liveness-step__preview" [src]="capturedImage()" alt="" />
    }
  </div>

  @if (errorMessage()) {
    <p class="liveness-step__error">{{ errorMessage() }}</p>
  }

  <div class="liveness-step__actions">
    @if (!cameraActive() && !capturedImage()) {
      <button mat-flat-button color="primary" type="button" (click)="startCamera()">
        {{ 'kyc.liveness.start_camera' | t }}
      </button>
    }

    @if (cameraActive() && !capturedImage()) {
      <button mat-flat-button color="primary" type="button" (click)="capture()">
        {{ 'kyc.liveness.capture' | t }}
      </button>
    }

    @if (capturedImage()) {
      <button mat-stroked-button type="button" (click)="retake()" [disabled]="submitting()">
        {{ 'kyc.liveness.retake' | t }}
      </button>
      <button mat-flat-button color="primary" type="button" (click)="submit()" [disabled]="submitting()">
        @if (submitting()) {
          <mat-spinner diameter="20" />
        } @else {
          {{ 'kyc.liveness.submit' | t }}
        }
      </button>
    }
  </div>
</div>
