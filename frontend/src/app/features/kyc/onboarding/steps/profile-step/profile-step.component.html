<form [formGroup]="form" (ngSubmit)="submit()" class="animate-fade-in space-y-5">
  <h2 class="mb-1">{{ 'kyc.profile.title' | t }}</h2>
  <p class="text-slate-600 mb-4">{{ 'kyc.profile.description' | t }}</p>

  <div class="form-group">
    <label class="form-label">{{ 'kyc.profile.investor_type_label' | t }}</label>
    <select formControlName="investor_type" class="form-input bg-white">
      @for (option of investorTypeOptions; track option.value) {
        <option [value]="option.value">{{ option.labelKey | t }}</option>
      }
    </select>
  </div>

  <div class="form-group">
    <label class="form-label">{{ 'kyc.profile.jurisdiction_label' | t }}</label>
    <select formControlName="jurisdiction" class="form-input bg-white">
      @for (option of jurisdictionOptions; track option.value) {
        <option [value]="option.value">{{ option.labelKey | t }}</option>
      }
    </select>
  </div>

  <div class="form-group">
    <label class="form-label">{{ 'kyc.profile.risk_profile_label' | t }}</label>
    <select formControlName="risk_profile" class="form-input bg-white">
      @for (option of riskProfileOptions; track option.value) {
        <option [value]="option.value">{{ option.labelKey | t }}</option>
      }
    </select>
  </div>

  <div class="form-group">
    <label class="form-label">{{ 'kyc.profile.legal_name_label' | t }}</label>
    <input class="form-input" type="text" formControlName="legal_name" />
  </div>

  <div class="form-group">
    <label class="form-label">{{ 'kyc.profile.date_of_birth_label' | t }}</label>
    <input class="form-input" type="date" formControlName="date_of_birth" />
  </div>

  <div class="form-group">
    <label class="form-label">{{ 'kyc.profile.nationality_label' | t }}</label>
    <select formControlName="nationality" class="form-input bg-white">
      @for (option of jurisdictionOptions; track option.value) {
        <option [value]="option.value">{{ option.labelKey | t }}</option>
      }
    </select>
  </div>

  @if (errorMessage()) {
    <p class="form-error">{{ errorMessage() }}</p>
  }

  <button class="btn-primary flex items-center gap-2" type="submit" [disabled]="form.invalid || submitting()">
    @if (submitting()) {
      <span class="spinner !h-4 !w-4 border-white"></span>
    }
    {{ 'kyc.profile.submit' | t }}
  </button>
</form>
